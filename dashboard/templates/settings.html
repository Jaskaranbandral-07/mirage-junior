{% extends 'base.html' %}
{% block title %}Settings - MIRAGE Junior{% endblock %}
{% block header_title %}System Settings{% endblock %}
{% block content %}
<div class="card">
    <h3>Telegram Alerts</h3>
    <form>
        <div class="form-group">
            <label>Bot Token</label>
            <input type="text" value="hidden***">
        </div>
        <div class="form-group">
            <label>Chat ID</label>
            <input type="text" value="123456789">
        </div>
        <button class="btn btn-primary" type="button">Save Integration</button>
    </form>
</div>
<div class="card" style="margin-top:20px;">
    <h3>Threat Scoring Weights</h3>
    <p>Configure points assigned per action.</p>
    <button class="btn btn-secondary">Edit Weights JSON</button>
</div>
<div class="card" style="margin-top:20px;">
    <h3>IP Whitelist</h3>
    <textarea rows="4" style="width:100%; background: #0d1117; color:#c9d1d9; padding:10px;">
127.0.0.1
192.168.0.0/16
10.0.0.0/8
    </textarea>
    <button class="btn btn-primary" style="margin-top:10px;">Update Whitelist</button>
</div>
{% endblock %}
