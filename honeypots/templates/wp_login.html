<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>WordPress &rsaquo; Log In</title>
    <style>
        body { font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Oxygen-Sans,Ubuntu,Cantarell,"Helvetica Neue",sans-serif; background: #f1f1f1; display: flex; justify-content: center; margin-top: 100px; }
        .login { background: #fff; border: 1px solid #c3c4c7; box-shadow: 0 1px 3px rgba(0,0,0,.04); padding: 26px 24px 46px; font-weight: 400; overflow: hidden; width: 320px; }
        .login label { display: block; margin-bottom: 8px; color: #3c434a; font-size: 14px; }
        .login input[type=text], .login input[type=password] { width: 100%; border: 1px solid #8c8f94; padding: 0 8px; line-height: 2; min-height: 40px; box-sizing: border-box; margin-bottom: 16px; border-radius: 4px; }
        .login .button { background: #2271b1; border-color: #2271b1; color: #fff; text-decoration: none; text-shadow: none; display: inline-block; font-size: 13px; line-height: 2.15384615; min-height: 30px; margin: 0; padding: 0 10px; cursor: pointer; border-width: 1px; border-style: solid; border-radius: 3px; float: right; }
    </style>
</head>
<body>
    <div class="login">
        <form method="POST" action="/wp-login.php">
            <p>
                <label for="user_login">Username or Email Address</label>
                <input type="text" name="log" id="user_login" class="input" size="20" required>
            </p>
            <p>
                <label for="user_pass">Password</label>
                <input type="password" name="pwd" id="user_pass" class="input" size="20" required>
            </p>
            <p class="submit">
                <input type="submit" name="wp-submit" id="wp-submit" class="button" value="Log In">
            </p>
        </form>
    </div>
</body>
</html>
